{% extends 'base.html' %} 

{% block title %} 
  SGE - Categoria 
{% endblock %}

{% block content %}
<!-- Begin Page Content -->
<div class="container-fluid">
  <!-- Page Heading -->
  <h1 class="h3 mb-1 text-gray-800">Detalhes da Categoria</h1>
  <p class="mb-4">Visualize abaixo os dados da categoria cadastrada.</p>

  <div class="card shadow mb-4">
    <div class="card-body">
      <h4 class="mb-4"><strong>Categoria:</strong> {{ category.name }}</strong></h4>

      <div class="row">
        <div class="col-md-12 mb-2">
          <label class="text-muted small mb-1">Nome</label>
          <div class="border rounded p-2 bg-light">{{ category.name|default:"-" }}</div>
        </div>

        <div class="col-md-12 mb-2">
          <label class="text-muted small mb-1">Descrição</label>
          <div class="border rounded p-2 bg-light">{{ category.description|default:"-" }}</div>
        </div>
      </div>

      <a
        href="{% url 'category_list' %}"
        class="btn btn-sm btn-secondary btn-icon-split shadow-sm"
      >
        <span class="icon text-white-50">
          <i class="fas fa-arrow-left"></i>
        </span>
        <span class="text">Voltar</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
