<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <style>
        body {
            background-color: #f8f9fc;
            color: #5a5c69;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 100px;
        }
        .error {
            font-size: 120px;
            font-weight: 800;
            color: #e74a3b;
        }
        .message {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .subtext {
            font-size: 16px;
            color: #858796;
        }
        a.btn {
            display: inline-block;
            margin-top: 30px;
            background-color: #4e73df;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
        }
        a.btn:hover {
            background-color: #2e59d9;
        }
    </style>
</head>
<body>
    
    <div class="error">
        {% block error_code %}{% endblock %}
    </div>
    <div class="message">{% block message %}{% endblock %}</div>
    <p class="subtext">{% block subtext %}{% endblock %}</p>
    {% block button %}
        <a href="{% block button_url %}{% endblock %}" class="btn">
            {% block button_text %}{% endblock %}
        </a>
    {% endblock %}
</body>
</html>
